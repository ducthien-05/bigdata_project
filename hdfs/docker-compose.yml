
services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870" # Cổng giao diện Web hiển thị dung lượng kho HDFS
      - "9000:9000" # Cổng nội bộ để Spark kết nối bắn data vào
    environment:
      - CLUSTER_NAME=bigdata_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1 # Máy local chỉ cần sao lưu 1 bản để tiết kiệm ổ cứng
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    ports:
      - "9864:9864"
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  default:
    name: bigdata_network
    external: true