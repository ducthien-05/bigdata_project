services:
  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - default

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - default

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    command: /opt/hive/bin/hive --service metastore --hiveconf hive.metastore.schema.verification=false --hiveconf datanucleus.schema.autoCreateTables=true
    environment:
      - SERVICE_PRECONDITION=hive-metastore-postgresql:5432
    ports:
      - "9083:9083"
    depends_on:
      hive-metastore-postgresql:
        condition: service_healthy
    networks:
      - default


  spark-thrift-server:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-thrift-server
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    command: >
      bash -c "sleep 30 && /spark/bin/spark-submit
      --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
      --master spark://spark-master:7077
      --driver-memory 4G
      --executor-memory 2G
      --conf spark.driver.maxResultSize=2G
      --conf spark.sql.shuffle.partitions=10
      --conf spark.sql.catalogImplementation=hive
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
      --conf spark.sql.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse
      spark-internal"
    ports:
      - "10000:10000"
    depends_on:
      - spark-master
      - hive-metastore
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
    name: bigdata_network
    external: true